name: RESET NIGHT AI Developer Team

on:
  workflow_dispatch:
    inputs:
      task:
        description: "One focused change request for the AI team"
        required: true
        type: string
      target_file:
        description: "Existing GDScript file (only godot/scripts/*.gd is allowed)"
        required: true
        default: "godot/scripts/mobile_controls.gd"
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  ai-develop-review-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login == 'FatihKoc81' &&
       github.event.comment.body &&
       startsWith(github.event.comment.body, '/ai-revise') &&
       github.event.issue.pull_request.url != '')
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    timeout-minutes: 25
    steps:
      - name: Checkout trusted main workflow and tools
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python in Godot container
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 --version
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends python3
            python3 --version
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache python3
            python3 --version
          else
            echo "No supported package manager found to install Python 3."
            exit 1
          fi

      - name: Mark checkout safe for container Git operations
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve task and safe target file
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TASK: ${{ inputs.task }}
          MANUAL_TARGET: ${{ inputs.target_file }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, re
          event = os.environ["EVENT_NAME"]
          if event == "workflow_dispatch":
              task = os.environ.get("MANUAL_TASK", "").strip()
              target = os.environ.get("MANUAL_TARGET", "").strip()
          else:
              body = os.environ.get("COMMENT_BODY", "")
              lines = body.splitlines()
              if not lines or lines[0].strip() != "/ai-revise":
                  raise SystemExit("Comment must start with /ai-revise on its own line")
              task = "\n".join(lines[1:]).strip()
              import json, urllib.request
              pr_number = os.environ["PR_NUMBER"]
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{pr_number}",
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  pr = json.loads(response.read().decode())
              if pr.get("base", {}).get("ref") != "main" or pr.get("head", {}).get("repo", {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
                  raise SystemExit("Only same-repository PRs targeting main can request AI revisions")
              head = pr.get("head", {}).get("ref", "")
              if (not head or head.startswith("-") or head.startswith("/") or head.endswith("/")
                  or not re.fullmatch(r"[A-Za-z0-9._/-]+", head)
                  or any(part in ("", ".", "..") for part in head.split("/"))):
                  raise SystemExit("Unsafe PR head branch")
              subprocess.run(["git", "fetch", "--no-tags", "origin", head, "--depth=1"], check=True)
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...FETCH_HEAD"], text=True
              ).splitlines()
              if len(changed) != 1:
                  raise SystemExit("Comment-triggered revision requires exactly one changed file in the PR")
              target = changed[0]
              pathlib.Path("/tmp/ai-pr-head-ref").write_text(head, encoding="utf-8")
          p = pathlib.PurePosixPath(target)
          if not target.startswith("godot/scripts/") or not target.endswith(".gd") or ".." in p.parts:
              raise SystemExit("Target must be an existing .gd file under godot/scripts/")
          if not task or len(task) > 1200:
              raise SystemExit("Task must contain 1–1200 characters")
          if event == "issue_comment":
              with open(target, "wb") as out:
                  subprocess.run(["git", "show", "FETCH_HEAD:" + target], check=True, stdout=out)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("task<<TASK_EOF\n" + task + "\nTASK_EOF\n")
              f.write("target=" + target + "\n")
          print("Request accepted for", target)
          PY

      - name: Gemini implements and GPT independently reviews
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          AI_TASK: ${{ steps.request.outputs.task }}
          AI_TARGET_FILE: ${{ steps.request.outputs.target }}
        run: python3 tools/ai_team/ai_developer.py

      - name: Apply GPT-approved replacement file
        env:
          AI_TARGET_FILE: ${{ steps.request.outputs.target }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          target = pathlib.PurePosixPath(os.environ["AI_TARGET_FILE"])
          if not str(target).startswith("godot/scripts/") or not str(target).endswith(".gd") or ".." in target.parts:
              raise SystemExit("Unsafe target path")
          report = json.loads(pathlib.Path("ai-code-review.json").read_text(encoding="utf-8"))
          if report.get("patch_applied") is not True or report.get("review", {}).get("approved") is not True:
              raise SystemExit("No GPT-approved change is available")
          source = pathlib.Path("ai-proposed-file.gd")
          if not source.is_file():
              raise SystemExit("Reviewed replacement file is missing")
          shutil.copyfile(source, pathlib.Path(str(target)))
          print("GPT-approved replacement copied to", target)
          PY

      - name: Validate Godot project and scenes
        run: |
          godot --version
          godot --headless --editor --path godot --quit
          godot --headless --path godot --script res://scripts/validate_scenes.gd

      - name: Prepare PR review summary
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("ai-code-review.json", encoding="utf-8"))
          r=d["review"]
          with open("ai-pr-body.md","w",encoding="utf-8") as f:
              f.write("## AI development report\n\n")
              f.write("- Gemini: "+d["gemini_model"]+"\n")
              f.write("- GPT reviewer: "+d["reviewer_model"]+"\n")
              f.write("- Target: `"+d["target"]+"`\n")
              f.write("- Independent review: "+("APPROVED" if r["approved"] else "REJECTED")+"\n\n")
              f.write(r["summary"]+"\n\n")
              if r["issues"]: f.write("### Reviewer notes\n"+"\n".join("- "+str(x) for x in r["issues"])+"\n")
              f.write("\nGodot headless project import and scene validation passed before this PR was created. Android APK and real-device tests still require separate verification.\n")
          PY

      - name: Create reviewable pull request (never push to main)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai/generated-${{ github.run_number }}
          base: main
          delete-branch: true
          title: "AI proposal: ${{ steps.request.outputs.task }}"
          body-path: ai-pr-body.md
          commit-message: "AI proposal: ${{ steps.request.outputs.task }}"
          add-paths: |
            ${{ steps.request.outputs.target }}

      - name: Upload AI review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reset-night-ai-developer-report
          path: |
            ai-code-review.json
            ai-proposed-file.gd
          if-no-files-found: ignore
          retention-days: 14

name: RESET NIGHT AI Team Connection Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ai-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify OpenAI and Gemini API connections
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/ai_team/connectivity_check.py

name: RESET NIGHT Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Install dependencies
        run: npm install
      - name: Prepare game logo and Android launcher icons
        run: |
          mkdir -p www
          cp IMG-20261110-WA0002.jpg www/logo.jpg
      - name: Add Android platform
        run: npx cap add android
      - name: Apply RESET NIGHT app identity and icon
        run: |
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            mkdir -p android/app/src/main/res/mipmap-$1
            convert IMG-20261110-WA0002.jpg -auto-orient -resize $2x$2^ -gravity center -extent $2x$2 -background "#080b12" android/app/src/main/res/mipmap-$1/ic_launcher.png
            cp android/app/src/main/res/mipmap-$1/ic_launcher.png android/app/src/main/res/mipmap-$1/ic_launcher_round.png
          done
          sed -i 's/android:label="[^"]*"/android:label="RESET NIGHT"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/versionCode 1/versionCode 2/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.1.0"/' android/app/build.gradle
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Rename APK for direct download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RESET-NIGHT.apk
      - name: Publish direct APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: RESET NIGHT Android
          body: "RESET NIGHT Android APK. Download RESET-NIGHT.apk directly."
          files: RESET-NIGHT.apk
          make_latest: true
          fail_on_unmatched_files: true
      - name: Upload backup build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RESET-NIGHT-backup
          path: RESET-NIGHT.apk
          if-no-files-found: error

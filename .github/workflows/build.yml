name: APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Oyun dosyalarini olustur
        run: |
          mkdir -p www
          cat > package.json <<'EOF_PKG'
          {
            "name": "arinma-gecesi",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.1.2",
              "@capacitor/cli": "6.1.2",
              "@capacitor/core": "6.1.2"
            }
          }
          EOF_PKG
          cat > capacitor.config.json <<'EOF_CFG'
          {
            "appId": "com.arinma.gecesi",
            "appName": "Reset Night",
            "webDir": "www"
          }
          EOF_CFG
          cat > www/icon.svg <<'EOF_ICON'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><defs><linearGradient id="m0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4efe4"/><stop offset="1" stop-color="#b9b3a7"/></linearGradient><linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfc9bd"/><stop offset="1" stop-color="#8f8a80"/></linearGradient><linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9b968c"/><stop offset="1" stop-color="#625e58"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070e"/><stop offset=".62" stop-color="#2a0c18"/><stop offset="1" stop-color="#0b0509"/></linearGradient><radialGradient id="gl" cx="256" cy="250" r="270" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e0283a" stop-opacity=".75"/><stop offset="1" stop-color="#e0283a" stop-opacity="0"/></radialGradient><radialGradient id="sb" cx="512" cy="0" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4a86c7" stop-opacity=".7"/><stop offset="1" stop-color="#4a86c7" stop-opacity="0"/></radialGradient><radialGradient id="sr" cx="0" cy="0" r="200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e0283a" stop-opacity=".5"/><stop offset="1" stop-color="#e0283a" stop-opacity="0"/></radialGradient><radialGradient id="vg" cx="256" cy="256" r="370" gradientUnits="userSpaceOnUse"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient></defs><rect width="512" height="512" fill="url(#sky)"/><rect width="512" height="512" fill="url(#gl)"/><rect width="512" height="512" fill="url(#sb)"/><rect width="512" height="512" fill="url(#sr)"/><circle cx="256" cy="215" r="120" fill="#e0283a" fill-opacity=".22"/><path d="M0 330L40 330L40 290L90 290L90 320L130 320L130 270L170 270L170 330L350 330L350 262L400 262L400 300L440 300L440 280L480 280L480 330L512 330L512 512L0 512Z" fill="#04060b"/><g transform="translate(150 196) scale(0.6)"><path d="M-178 420C-178 250 -130 176 -62 148C-36 138 -26 128 0 128C26 128 36 138 62 148C130 176 178 250 178 420Z" fill="#040509" stroke="#d1202f" stroke-opacity=".55" stroke-width="4"/><ellipse cx="0" cy="0" rx="92" ry="114" fill="#040509" stroke="#d1202f" stroke-opacity=".6" stroke-width="4"/><ellipse cx="0" cy="8" rx="70" ry="94" fill="#000"/><path d="M0 -68C42 -68 58 -30 55 12C52 52 30 86 0 88C-30 86 -52 52 -55 12C-58 -30 -42 -68 0 -68Z" fill="url(#m2)" stroke="#1b1614" stroke-width="2.5"/><path d="M-40 -16Q-22 -30 -6 -8Q-24 0 -40 -16Z" fill="#05070d"/><path d="M40 -16Q22 -30 6 -8Q24 0 40 -16Z" fill="#05070d"/><path d="M0 -4L-5 22L4 24" stroke="#14100f" stroke-opacity=".45" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M-30 42Q0 78 30 42" stroke="#14100f" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-14 56L-14 66M0 59L0 70M14 56L14 66" stroke="#14100f" stroke-width="3" stroke-linecap="round"/></g><g transform="translate(362 196) scale(0.6)"><path d="M-178 420C-178 250 -130 176 -62 148C-36 138 -26 128 0 128C26 128 36 138 62 148C130 176 178 250 178 420Z" fill="#040509" stroke="#d1202f" stroke-opacity=".55" stroke-width="4"/><ellipse cx="0" cy="0" rx="92" ry="114" fill="#040509" stroke="#d1202f" stroke-opacity=".6" stroke-width="4"/><ellipse cx="0" cy="8" rx="70" ry="94" fill="#000"/><path d="M0 -68C42 -68 58 -30 55 12C52 52 30 86 0 88C-30 86 -52 52 -55 12C-58 -30 -42 -68 0 -68Z" fill="url(#m2)" stroke="#1b1614" stroke-width="2.5"/><path d="M-40 -16Q-22 -30 -6 -8Q-24 0 -40 -16Z" fill="#05070d"/><path d="M40 -16Q22 -30 6 -8Q24 0 40 -16Z" fill="#05070d"/><path d="M0 -4L-5 22L4 24" stroke="#14100f" stroke-opacity=".45" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M24 4L24 44M33 6L33 38" stroke="#d1202f" stroke-width="4" stroke-linecap="round"/><path d="M-12 58Q0 52 12 58" stroke="#14100f" stroke-width="4" fill="none" stroke-linecap="round"/></g><g transform="translate(96 300) scale(0.78)"><path d="M-178 420C-178 250 -130 176 -62 148C-36 138 -26 128 0 128C26 128 36 138 62 148C130 176 178 250 178 420Z" fill="#05070b" stroke="#d1202f" stroke-opacity=".55" stroke-width="4"/><ellipse cx="0" cy="0" rx="92" ry="114" fill="#05070b" stroke="#d1202f" stroke-opacity=".6" stroke-width="4"/><ellipse cx="0" cy="8" rx="70" ry="94" fill="#000"/><path d="M0 -68C42 -68 58 -30 55 12C52 52 30 86 0 88C-30 86 -52 52 -55 12C-58 -30 -42 -68 0 -68Z" fill="url(#m1)" stroke="#1b1614" stroke-width="2.5"/><path d="M-40 -16Q-22 -30 -6 -8Q-24 0 -40 -16Z" fill="#05070d"/><path d="M40 -16Q22 -30 6 -8Q24 0 40 -16Z" fill="#05070d"/><path d="M0 -4L-5 22L4 24" stroke="#14100f" stroke-opacity=".45" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M-44 22L-22 46M-22 22L-44 46" stroke="#d1202f" stroke-width="6" stroke-linecap="round"/><path d="M-14 56L14 56" stroke="#14100f" stroke-width="4" stroke-linecap="round"/></g><g transform="translate(416 300) scale(0.78)"><path d="M-178 420C-178 250 -130 176 -62 148C-36 138 -26 128 0 128C26 128 36 138 62 148C130 176 178 250 178 420Z" fill="#05070b" stroke="#d1202f" stroke-opacity=".55" stroke-width="4"/><ellipse cx="0" cy="0" rx="92" ry="114" fill="#05070b" stroke="#d1202f" stroke-opacity=".6" stroke-width="4"/><ellipse cx="0" cy="8" rx="70" ry="94" fill="#000"/><path d="M0 -68C42 -68 58 -30 55 12C52 52 30 86 0 88C-30 86 -52 52 -55 12C-58 -30 -42 -68 0 -68Z" fill="url(#m1)" stroke="#1b1614" stroke-width="2.5"/><path d="M-40 -16Q-22 -30 -6 -8Q-24 0 -40 -16Z" fill="#05070d"/><path d="M40 -16Q22 -30 6 -8Q24 0 40 -16Z" fill="#05070d"/><path d="M0 -4L-5 22L4 24" stroke="#14100f" stroke-opacity=".45" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="-50" y="-46" width="100" height="9" fill="#d1202f" transform="rotate(-4)"/><path d="M-14 56L14 56" stroke="#14100f" stroke-width="4" stroke-linecap="round"/></g><g transform="translate(256 262) scale(1)"><path d="M-178 420C-178 250 -130 176 -62 148C-36 138 -26 128 0 128C26 128 36 138 62 148C130 176 178 250 178 420Z" fill="#07090f" stroke="#d1202f" stroke-opacity=".55" stroke-width="4"/><ellipse cx="0" cy="0" rx="92" ry="114" fill="#07090f" stroke="#d1202f" stroke-opacity=".6" stroke-width="4"/><ellipse cx="0" cy="8" rx="70" ry="94" fill="#000"/><path d="M0 -68C42 -68 58 -30 55 12C52 52 30 86 0 88C-30 86 -52 52 -55 12C-58 -30 -42 -68 0 -68Z" fill="url(#m0)" stroke="#1b1614" stroke-width="2.5"/><path d="M-40 -16Q-22 -30 -6 -8Q-24 0 -40 -16Z" fill="#05070d"/><path d="M40 -16Q22 -30 6 -8Q24 0 40 -16Z" fill="#05070d"/><path d="M0 -4L-5 22L4 24" stroke="#14100f" stroke-opacity=".45" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M0 -68L0 -22" stroke="#d1202f" stroke-width="8" stroke-linecap="round"/><path d="M-24 54L24 54M-16 47L-16 61M-5 47L-5 61M5 47L5 61M16 47L16 61" stroke="#14100f" stroke-width="3.5" stroke-linecap="round"/></g><rect width="512" height="512" fill="url(#vg)"/></svg>
          EOF_ICON
          cat > www/index.html <<'EOF_HTML'
          <!DOCTYPE html>
          <html lang="tr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
          <title>Reset Night</title>
          <link rel="icon" href="icon.png">
          <style>
          html,body{margin:0;height:100%;background:#05070d;color:#ece8e1;font-family:"Arial Narrow",Arial,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
          #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
          canvas{display:block}
          #ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,7,13,.94);text-align:center;padding:16px}
          #menu,#end,#intro{display:flex;flex-direction:column;align-items:center;gap:12px}
          h1{font:400 40px Impact,sans-serif;color:#d1202f;letter-spacing:.05em;margin:0}
          h2{font:400 34px Impact,sans-serif;margin:0}
          button{font:inherit;font-size:19px;padding:14px 22px;border:0;border-radius:10px;background:#2a3550;color:#fff;min-width:250px}
          button.s{min-width:118px}
          button.on{background:#d1202f}
          button.go{background:#3a6ea5}
          input{font:inherit;font-size:20px;padding:12px;border-radius:10px;border:2px solid #3a6ea5;background:#0d1220;color:#fff;text-align:center;width:214px;text-transform:uppercase}
          p{margin:0;color:#9aa0b3;max-width:300px;line-height:1.35}
          .box{border:2px solid #d1202f;padding:14px;border-radius:10px;max-width:300px;line-height:1.45;color:#ece8e1;background:#10060a;font-size:16px}
          .hide{display:none!important}
          </style>
          </head>
          <body>
          <div id="wrap"><canvas id="c"></canvas></div>
          <div id="ui">
          <div id="intro">
          <img src="logo.jpg" alt="" style="width:100%;max-width:320px;border-radius:14px" onerror="this.onerror=null;this.src='icon.svg';this.style.width='132px'">
          <div class="box"><b style="color:#d1202f">ULUSAL ACİL DURUM YAYINI</b><br>Bu bir tatbikat değildir.<br><br>Bu gece saat 19:00’dan sabah 07:00’ya kadar her türlü suç serbesttir. Polis, itfaiye ve ambulans hizmet vermeyecektir.<br><br>Başlangıç sireniyle gece açılır, bitiş sireniyle kapanır. Kapılarınızı sağlamlaştırın, ışıkları kısın.<br><br>Sabaha sağ çıkanlara iyi şanslar.</div>
          <button class="go" id="bStart">Devam</button>
          </div>
          <div id="menu" class="hide">
          <h1>RESET NIGHT</h1>
          <p>Siren 19:00’da çalar, sabah 07:00’da biter. Savunan sabaha dayanır, saldıran içeri girer.</p>
          <div><button class="s on" id="bD">Savun</button> <button class="s" id="bA">Saldır</button></div>
          <button class="go" id="bSolo">Tek kişilik</button>
          <button class="go" id="bHost">Oda kur</button>
          <div><input id="code" maxlength="4" placeholder="KOD" autocomplete="off"></div>
          <button class="go" id="bJoin">Odaya katıl</button>
          <p id="st"></p>
          </div>
          <div id="end" class="hide"><h2 id="eh"></h2><p id="ep"></p><button class="go" id="bBack">Menüye dön</button></div>
          </div>
          <script>
          var cv=document.getElementById("c"),cx=cv.getContext("2d"),W=360,H=640,SC=1;
          function fit(){SC=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*SC+"px";cv.style.height=H*SC+"px";cv.width=W*2;cv.height=H*2;cx.setTransform(2,0,0,2,0,0)}
          fit();addEventListener("resize",fit);
          var EP=[[180,220],[270,320],[180,420],[90,320]],AP=[[180,196],[296,320],[180,444],[64,320]],SP=[[180,20],[345,320],[180,620],[15,320]];
          var G,mode="solo",sel="d",me="d",playing=false,ended=false,peer=null,conn=null,T=0,acc=0,botT=0,last=0,au=null;
          function opp(r){return r=="d"?"a":"d"}
          function newG(){return{time:90,lives:5,planks:5,energy:4,cd:0,ent:[100,100,100,100],ra:[],nid:1,over:0}}
          G=newG();
          function $(i){return document.getElementById(i)}
          function st(t){$("st").textContent=t}
          function beep(f,d){try{if(!au)au=new(window.AudioContext||window.webkitAudioContext)();var o=au.createOscillator(),g=au.createGain();o.frequency.value=f;o.type="square";g.gain.value=.05;o.connect(g);g.connect(au.destination);o.start();o.stop(au.currentTime+d)}catch(e){}}
          function act(k,a,role){
            a=Number(a)|0;
            if(role=="d"){
              if(k=="bar"&&a>=0&&a<4&&G.planks>=1&&G.ent[a]<100){G.planks-=1;G.ent[a]=Math.min(100,G.ent[a]+25)}
              else if(k=="rep"&&G.cd<=0){for(var i=0;i<G.ra.length;i++)if(G.ra[i].id==a){G.ra.splice(i,1);G.cd=1.2;break}}
            }else if(k=="atk"&&a>=0&&a<4&&G.energy>=1){
              G.energy-=1;G.ra.push({id:G.nid++,e:a,x:SP[a][0],y:SP[a][1],s:0});
            }
          }
          function sim(dt){
            G.time-=dt;G.planks=Math.min(8,G.planks+dt/1.6);G.energy=Math.min(6,G.energy+dt/1.2);G.cd=Math.max(0,G.cd-dt);
            for(var i=G.ra.length-1;i>=0;i--){
              var r=G.ra[i];
              if(r.s==0){
                var p=AP[r.e],dx=p[0]-r.x,dy=p[1]-r.y,d=Math.hypot(dx,dy);
                if(d<3)r.s=1;else{r.x+=dx/d*58*dt;r.y+=dy/d*58*dt}
              }else{
                G.ent[r.e]=Math.max(0,G.ent[r.e]-14*dt);
                if(G.ent[r.e]<=0){G.lives--;G.ra.splice(i,1);beep(120,.25)}
              }
            }
            if(G.lives<=0)G.over=1;else if(G.time<=0)G.over=2;
          }
          function bot(dt){
            if(mode!="solo")return;
            botT+=dt;var br=opp(me),prog=1-G.time/90;
            if(br=="a"){
              if(botT>1.3-0.6*prog&&G.energy>=1){botT=0;var e=Math.random()<.5?Math.floor(Math.random()*4):G.ent.indexOf(Math.min.apply(null,G.ent));act("atk",e,"a")}
            }else if(botT>0.9){
              botT=0;
              var tgt=null,bd=1e9;
              G.ra.forEach(function(r){if(r.s==1&&G.ent[r.e]<bd){bd=G.ent[r.e];tgt=r}});
              if(tgt&&G.cd<=0&&Math.random()<.5)act("rep",tgt.id,"d");
              else{var w=G.ent.indexOf(Math.min.apply(null,G.ent));act("bar",w,"d")}
            }
          }
          function near(x,y,m){var b=-1,bd=m;for(var i=0;i<4;i++){var d=Math.hypot(EP[i][0]-x,EP[i][1]-y);if(d<bd){bd=d;b=i}}return b}
          function send(k,a){
            if(mode=="guest"){if(conn&&conn.open)conn.send({t:"a",k:k,a:a})}else act(k,a,me);
            beep(k=="atk"?300:520,.06);
          }
          cv.addEventListener("pointerdown",function(e){
            if(!playing||G.over)return;
            var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/SC,y=(e.clientY-r.top)/SC;
            if(me=="d"){
              var best=null,bd=30;
              G.ra.forEach(function(q){var d=Math.hypot(q.x-x,q.y-y);if(d<bd){bd=d;best=q}});
              if(best){send("rep",best.id);return}
              var i=near(x,y,130);if(i>=0)send("bar",i);
            }else send("atk",near(x,y,99999));
          });
          function clock(){var h=19+(1-G.time/90)*12,hh=Math.floor(h)%24,mm=Math.floor((h%1)*60);return(hh<10?"0":"")+hh+":"+(mm<10?"0":"")+mm}
          function draw(){
            cx.fillStyle="#0a0f1c";cx.fillRect(0,0,W,H);
            cx.strokeStyle="rgba(255,255,255,.04)";cx.lineWidth=1;
            for(var i=0;i<=W;i+=30){cx.beginPath();cx.moveTo(i,0);cx.lineTo(i,H);cx.stroke()}
            for(i=0;i<=H;i+=30){cx.beginPath();cx.moveTo(0,i);cx.lineTo(W,i);cx.stroke()}
            var s=Math.sin(T*6),a=.05+.06*Math.abs(s);
            cx.fillStyle=s>0?"rgba(209,32,47,"+a+")":"rgba(58,110,165,"+a+")";
            cx.fillRect(s>0?0:W/2,0,W/2,H);
            cx.fillStyle="#1b2338";cx.fillRect(90,220,180,200);
            cx.strokeStyle="#33406a";cx.lineWidth=5;cx.strokeRect(90,220,180,200);
            for(i=0;i<5;i++){cx.beginPath();cx.arc(120+i*30,320,i<G.lives?7:4,0,7);cx.fillStyle=i<G.lives?"#f2b134":"#2a3350";cx.shadowColor="#f2b134";cx.shadowBlur=i<G.lives?14:0;cx.fill()}
            cx.shadowBlur=0;
            for(i=0;i<4;i++){
              var p=EP[i],hz=(i%2==0),w=hz?46:10,h=hz?10:46,f=G.ent[i]/100;
              cx.fillStyle="#05070d";cx.fillRect(p[0]-w/2,p[1]-h/2,w,h);
              cx.fillStyle="hsl("+(f*115)+",70%,48%)";
              if(hz)cx.fillRect(p[0]-w/2,p[1]-h/2,w*f,h);else cx.fillRect(p[0]-w/2,p[1]+h/2-h*f,w,h*f);
            }
            G.ra.forEach(function(r){
              var x=r.x+(r.s?Math.sin(T*45+r.id)*1.6:0),y=r.y;
              cx.shadowColor="#d1202f";cx.shadowBlur=14;cx.fillStyle="#2a0f18";cx.beginPath();cx.arc(x,y,11,0,7);cx.fill();
              cx.shadowBlur=0;cx.fillStyle="#e8e6e3";cx.beginPath();cx.arc(x,y-1,6.5,0,7);cx.fill();
              cx.fillStyle="#1a0a10";cx.beginPath();cx.arc(x-2.5,y-2,1.3,0,7);cx.arc(x+2.5,y-2,1.3,0,7);cx.fill();
              cx.fillRect(x-2.5,y+1.5,5,1.2);
            });
            cx.fillStyle="#ece8e1";cx.textAlign="center";cx.font="22px Impact,sans-serif";cx.fillText(clock(),W/2,38);
            cx.font="14px Arial";cx.fillStyle="#9aa0b3";cx.fillText("Can "+G.lives+"/5",W/2,58);
            var v=me=="d"?G.planks/8:G.energy/6;
            cx.fillStyle="#26304a";cx.fillRect(60,560,240,12);
            cx.fillStyle=me=="d"?"#4caf7d":"#d1202f";cx.fillRect(60,560,240*Math.min(1,Math.max(0,v)),12);
            cx.fillStyle="#ece8e1";cx.font="15px Arial";
            cx.fillText(me=="d"?"Tahta":"Güç",W/2,552);
            cx.fillStyle="#9aa0b3";cx.font="14px Arial";
            cx.fillText(me=="d"?"Kapıya dokun: tahta çak · Maskeliye dokun: kov":"Dokun: o kapıya saldırgan gönder",W/2,596);
          }
          function showEnd(){
            var win=(me=="d"&&G.over==2)||(me=="a"&&G.over==1);
            $("eh").textContent=win?"Kazandın":"Kaybettin";
            $("eh").style.color=win?"#4caf7d":"#d1202f";
            $("ep").textContent=G.over==2?"Gün doğdu, ev ayakta kaldı.":"Saldırganlar eve girdi.";
            $("menu").classList.add("hide");$("end").classList.remove("hide");$("ui").classList.remove("hide");
          }
          function loop(ts){
            var dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;
            if(playing){
              if(mode!="guest"&&!G.over){sim(dt);bot(dt)}
              if(mode=="host"&&conn&&conn.open){acc+=dt;if(acc>.08||G.over){acc=0;conn.send({t:"s",g:G})}}
              if(G.over&&!ended){ended=true;showEnd()}
            }
            draw();requestAnimationFrame(loop);
          }
          requestAnimationFrame(loop);
          function startGame(m){
            mode=m;G=newG();ended=false;playing=true;botT=0;
            $("ui").classList.add("hide");
          }
          function loadNet(cb){
            if(window.Peer)return cb();
            var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js";
            s.onload=cb;s.onerror=function(){st("İnternet bağlantısı gerekli.")};document.head.appendChild(s);
          }
          function hook(){
            conn.on("data",function(d){
              if(d.t=="hi"){me=opp(d.role);startGame("guest")}
              else if(d.t=="s"&&mode=="guest"){G=d.g}
              else if(d.t=="a"&&mode=="host"){act(d.k,d.a,opp(me))}
            });
            conn.on("close",function(){if(playing&&!ended){ended=true;G.over=G.over||0;$("eh").textContent="Bağlantı koptu";$("eh").style.color="#d1202f";$("ep").textContent="";$("menu").classList.add("hide");$("end").classList.remove("hide");$("ui").classList.remove("hide")}});
          }
          function rc(){var c="ABCDEFGHJKLMNPRSTUVYZ23456789",s="";for(var i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
          function host(){
            loadNet(function(){
              if(peer)peer.destroy();
              var code=rc();peer=new Peer("arinma-"+code);
              peer.on("open",function(){st("Oda kodu: "+code+". Arkadaşın katılınca oyun başlar.")});
              peer.on("connection",function(c){conn=c;hook();c.on("open",function(){me=sel;c.send({t:"hi",role:sel});startGame("host")})});
              peer.on("error",function(e){if(e.type=="unavailable-id")host();else st("Hata: "+e.type)});
            });
          }
          function join(){
            var code=$("code").value.trim().toUpperCase();
            if(code.length<4){st("4 harfli kodu yaz.");return}
            loadNet(function(){
              if(peer)peer.destroy();
              peer=new Peer();
              peer.on("open",function(){st("Bağlanılıyor...");conn=peer.connect("arinma-"+code);hook()});
              peer.on("error",function(e){st(e.type=="peer-unavailable"?"Oda bulunamadı.":"Hata: "+e.type)});
            });
          }
          function role(r){sel=r;$("bD").classList.toggle("on",r=="d");$("bA").classList.toggle("on",r=="a")}
          $("bStart").onclick=function(){$("intro").classList.add("hide");$("menu").classList.remove("hide")};
          $("bD").onclick=function(){role("d")};
          $("bA").onclick=function(){role("a")};
          $("bSolo").onclick=function(){me=sel;startGame("solo")};
          $("bHost").onclick=host;
          $("bJoin").onclick=join;
          $("bBack").onclick=function(){
            if(peer){peer.destroy();peer=null}conn=null;playing=false;ended=false;st("");
            $("end").classList.add("hide");$("menu").classList.remove("hide");
          };
          </script>
          </body>
          </html>
          EOF_HTML
      - run: npm install
      - run: npx cap add android
      - name: Logo ve ikonlari olustur
        run: |
          L=$(ls -1 *.jpg *.jpeg *.png *.webp 2>/dev/null | head -n 1)
          command -v convert >/dev/null || sudo apt-get install -y -qq imagemagick
          sudo apt-get install -y -qq librsvg2-bin
          if [ -n "$L" ]; then
            W=$(identify -format %w "$L"); H=$(identify -format %h "$L")
            CW=$((H*112/100)); [ $CW -gt $W ] && CW=$W
            [ $CW -lt $H ] && CW=$H
            convert "$L" -resize 1024x -quality 88 www/logo.jpg
            convert "$L" -gravity center -crop ${CW}x${H}+0+0 +repage -background black -gravity center -extent ${CW}x${CW} -resize 512x512 icon.png
          else
            rsvg-convert -w 512 -h 512 www/icon.svg -o icon.png
          fi
          cp icon.png www/icon.png
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            m=android/app/src/main/res/mipmap-$n
            mkdir -p $m
            convert icon.png -resize ${s}x${s} $m/ic_launcher.png
            cp $m/ic_launcher.png $m/ic_launcher_round.png
            q=$((f*60/100))
            convert icon.png -resize ${q}x${q} -background black -gravity center -extent ${f}x${f} $m/ic_launcher_foreground.png
          done
          sed -i 's/>#[0-9A-Fa-f]*</>#000000</' android/app/src/main/res/values/ic_launcher_background.xml || true
      - run: sed -i 's/android:name=".MainActivity"/& android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arinma-gecesi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

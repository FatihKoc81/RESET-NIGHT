name: RESET NIGHT Godot 4 Android Validation
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: reset-night-godot-debug-keystore-v2
      - name: Export and validate
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=RESET NIGHT Debug,O=RESET NIGHT,C=TR" -keyalg RSA -keysize 2048 -validity 10000
          fi
          cp ~/.android/debug.keystore godot/resetnight-debug.keystore
          chmod +x godot/build_android.sh
          GODOT_BIN=godot ANDROID_HOME="$ANDROID_HOME" godot/build_android.sh
